name: Prévia do mapa 3D (dados de Caxambu, não publica)

# Junta os dados de verdade de Caxambu para a PRÉVIA do mapa 3D "estilo jogo de corrida":
# ruas/áreas (OpenStreetMap, ODbL), relevo (Copernicus DEM GLO-30) e prédios (OSM + Microsoft ML Buildings, ODbL),
# com uma rota de exemplo. O resultado fica só como artefato desta execução (nada de release, nada vai para a central).
on:
  workflow_dispatch:
  push:
    branches: [rascunho-previa3d]

permissions:
  contents: read

jobs:
  previa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LAT0: "-21.977"
      LON0: "-44.932"
      R_PREDIOS: "1700"
      R_RUAS: "3000"
      R_DEM: "3000"
      PASSO_DEM: "30"
      ROTA: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ferramentas
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install -q "osmium==4.3.2" "rasterio==1.4.3" "numpy==2.2.6" "shapely==2.1.1"

      - name: OpenStreetMap (Geofabrik Sudeste, recorte de Caxambu)
        run: |
          set -euo pipefail
          mkdir -p w sai
          curl -fsSL --retry 5 --retry-delay 10 -o w/sudeste.osm.pbf \
            https://download.geofabrik.de/south-america/brazil/sudeste-latest.osm.pbf
          ls -la w/sudeste.osm.pbf
          osmium extract -b "-44.975,-22.005,-44.889,-21.949" --strategy complete_ways -o w/caxambu.osm.pbf w/sudeste.osm.pbf
          rm w/sudeste.osm.pbf
          ls -la w/caxambu.osm.pbf

      - name: Relevo (Copernicus DEM GLO-30, AWS)
        run: |
          set -euo pipefail
          T=Copernicus_DSM_COG_10_S22_00_W045_00_DEM
          curl -fsSL --retry 5 -o w/dem.tif "https://copernicus-dem-30m.s3.amazonaws.com/$T/$T.tif"
          ls -la w/dem.tif

      - name: Prédios (Microsoft Global ML Building Footprints)
        run: |
          set -euo pipefail
          python3 -I ferramentas/previa3d/baixar_ms.py w/ms

      - name: Gerar os dados da prévia
        run: |
          set -euo pipefail
          python3 -I ferramentas/previa3d/gerar_previa.py w/caxambu.osm.pbf w/dem.tif w/ms sai/previa.json 2>&1 | tee sai/resumo.txt
          gzip -9 -k sai/previa.json
          ls -la sai

      - uses: actions/upload-artifact@v4
        with:
          name: previa3d
          path: sai/
          retention-days: 7
