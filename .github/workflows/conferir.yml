name: Conferir rascunho (não publica)

# Ramos de rascunho: só confere se o código compila. Nada vai para a central.
on:
  push:
    branches-ignore: [main]

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar (central e celular)
        shell: bash
        run: |
          set -o pipefail
          if ! gradle --no-daemon --continue :app:compileReleaseKotlin :celular:compileReleaseKotlin 2>&1 | tee compilar.log; then
            # Os erros viram uma anotação (dá para ler pela API do GitHub, sem baixar o log).
            ERROS=$(grep -E '^e: |What went wrong|^> |error:|AAPT' compilar.log | head -40 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
            echo "::error title=Compilação falhou::${ERROS}"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir o servidor
        run: node --check servidor/src/index.js
