name: Montar o app do celular

# App "Painel ASX Celular" (pasta celular/). Monta, assina com a MESMA chave da central (segredo CHAVE_BASE64)
# e publica o painel-asx-celular.apk na release FIXA "celular" (apaga e cria de novo a cada montagem).
# A release "celular" é SEMPRE pré-lançamento e NUNCA "latest": o Atualizador da central lê releases/latest.
on:
  push:
    branches: [main]
    paths:
      - 'celular/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: celular
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar a chave de assinatura
        env:
          CHAVE_BASE64: ${{ secrets.CHAVE_BASE64 }}
        run: |
          if [ -z "$CHAVE_BASE64" ]; then
            echo "::error::Falta o segredo CHAVE_BASE64 no GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$CHAVE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/chave.p12"

      - name: Montar o APK do celular
        env:
          NUMERO_VERSAO: ${{ github.run_number }}
          CHAVE_ARQUIVO: ${{ runner.temp }}/chave.p12
        run: gradle --no-daemon :celular:assembleRelease

      - name: Publicar na release fixa "celular" (pré-lançamento, nunca latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp celular/build/outputs/apk/release/celular-release.apk painel-asx-celular.apk
          NOTAS="App do celular c${{ github.run_number }} (Painel ASX Celular).

          $(git log -1 --pretty=%B)"
          gh release delete celular --yes --cleanup-tag || true
          gh release create celular painel-asx-celular.apk \
            --target "${{ github.sha }}" \
            --title "Painel ASX Celular (c${{ github.run_number }})" \
            --notes "$NOTAS" \
            --prerelease --latest=false
