name: Montar e publicar o app

# Cada envio para o main que mexa no app: monta o APK (com o endereco do conector),
# assina sempre com a MESMA chave e publica como versao nova. A central avisa o Leonardo
# ("Atualizacao disponivel") e instala quando ele aprova.
# O conector (servidor/) tem workflow proprio: conector.yml. O app do celular (celular/) tem o celular.yml:
# mudanca so no celular NAO gera versao nova da central (cada versao nova derruba o Controle).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'servidor/**'
      - 'celular/**'
      - '.github/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: montar
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Servidor do canal pelo cabo (dex para o celular)
        run: bash app/canal-servidor/montar.sh app/canal-servidor/src app/src/main/assets/canal-servidor.jar

      - name: Compilar (conferir se o codigo esta certo)
        env:
          NUMERO_VERSAO: ${{ github.run_number }}
          SERVIDOR_URL: https://painel-asx.somos-vinciag.workers.dev
        run: gradle --no-daemon :app:compileReleaseKotlin

      - name: Preparar a chave de assinatura
        env:
          CHAVE_BASE64: ${{ secrets.CHAVE_BASE64 }}
        run: |
          if [ -z "$CHAVE_BASE64" ]; then
            echo "::error::Falta o segredo CHAVE_BASE64 no GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$CHAVE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/chave.p12"

      - name: Montar o APK
        env:
          NUMERO_VERSAO: ${{ github.run_number }}
          CHAVE_ARQUIVO: ${{ runner.temp }}/chave.p12
          SERVIDOR_URL: https://painel-asx.somos-vinciag.workers.dev
        run: gradle --no-daemon :app:assembleRelease

      - name: Publicar a versao
        env:
          GH_TOKEN: ${{ github.token }}
          SERVIDOR_URL: https://painel-asx.somos-vinciag.workers.dev
        run: |
          cp app/build/outputs/apk/release/app-release.apk painel-asx.apk
          NOTAS="$(git log -1 --pretty=%B)

          Conector: ${SERVIDOR_URL:-não publicado}"
          gh release create "v${{ github.run_number }}" painel-asx.apk \
            --title "v${{ github.run_number }}" \
            --notes "$NOTAS"
