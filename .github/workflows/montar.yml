name: Montar e publicar o app

# Cada envio para o main monta o APK, assina sempre com a MESMA chave e
# publica como versao nova. O app na central ve a versao nova e atualiza sozinho.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: montar
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar (conferir se o codigo esta certo)
        env:
          NUMERO_VERSAO: ${{ github.run_number }}
        run: gradle --no-daemon compileReleaseKotlin

      - name: Preparar a chave de assinatura
        env:
          CHAVE_BASE64: ${{ secrets.CHAVE_BASE64 }}
        run: |
          if [ -z "$CHAVE_BASE64" ]; then
            echo "::error::Falta o segredo CHAVE_BASE64 no GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$CHAVE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/chave.p12"

      - name: Montar o APK
        env:
          NUMERO_VERSAO: ${{ github.run_number }}
          CHAVE_ARQUIVO: ${{ runner.temp }}/chave.p12
        run: gradle --no-daemon assembleRelease

      - name: Publicar a versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk painel-asx.apk
          gh release create "v${{ github.run_number }}" painel-asx.apk \
            --title "v${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B)"
