name: Montar o Painel Redmi

# App "Painel Redmi" (pasta robo/, projeto Gradle separado). Em qualquer ramo: monta e guarda o APK como artefato.
# Só no main: publica o painel-redmi.apk na release FIXA "robo" (pré-lançamento, NUNCA latest:
# o Atualizador da central lê releases/latest).
on:
  push:
    paths:
      - 'robo/**'
      - '.github/workflows/robo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Preparar a chave de assinatura
        env:
          CHAVE_BASE64: ${{ secrets.CHAVE_BASE64 }}
        run: |
          if [ -z "$CHAVE_BASE64" ]; then
            echo "::error::Falta o segredo CHAVE_BASE64 no GitHub."
            exit 1
          fi
          echo "$CHAVE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/chave.p12"

      - name: Montar o APK
        working-directory: robo
        env:
          NUMERO_VERSAO: ${{ github.run_number }}
          CHAVE_ARQUIVO: ${{ runner.temp }}/chave.p12
          SERVIDOR_URL: https://painel-asx.somos-vinciag.workers.dev
        run: |
          set -o pipefail
          if ! gradle --no-daemon assembleRelease 2>&1 | tee montar.log; then
            grep -E "^e: |error:|FAILED|What went wrong" -A3 montar.log | head -60 > erros.txt || true
            while IFS= read -r l; do echo "::error::$l"; done < erros.txt
            exit 1
          fi
          cp build/outputs/apk/release/*-release.apk ../painel-redmi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: painel-redmi
          path: painel-redmi.apk

      - name: Publicar na release fixa "robo" (pré-lançamento, nunca latest)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete robo --yes --cleanup-tag || true
          gh release create robo painel-redmi.apk \
            --target "${{ github.sha }}" \
            --title "Painel Redmi (r${{ github.run_number }})" \
            --notes "App do celular robô (Redmi Note 13 Pro+). $(git log -1 --pretty=%s)" \
            --prerelease --latest=false
