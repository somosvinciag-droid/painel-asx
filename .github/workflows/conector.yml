name: Publicar o conector (Cloudflare)

# Só o servidor "painel-asx" (o conector do Claude). Não mexe na central.
on:
  push:
    branches: [main]
    paths:
      - 'servidor/**'
      - '.github/workflows/conector.yml'
  workflow_dispatch:

jobs:
  conector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar na Cloudflare
        working-directory: servidor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee saida.txt
